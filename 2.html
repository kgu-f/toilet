<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Toilet English</title>
  <style>
    :root{
      --divider: 10px;
      --bg: #0b0f19;
      --panel: #0f172a;
      --line: rgba(255,255,255,.12);
      --text: rgba(255,255,255,.9);
      --muted: rgba(255,255,255,.65);
      --accent: #60a5fa;
    }
    *{ box-sizing:border-box; }
    body{ margin:0; background:var(--bg); color:var(--text); font-family:system-ui, -apple-system, "Segoe UI", sans-serif; }

    /* ヘッダー（任意） */
    header{
      height:48px; display:flex; align-items:center; gap:12px;
      padding:0 14px; border-bottom:1px solid var(--line);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,0));
      position:sticky; top:0; z-index:10;
    }
    header .title{ font-weight:700; letter-spacing:.2px; }
    header .hint{ color:var(--muted); font-size:12px; }

    .container{
      display:flex;
      height: calc(100vh - 48px);
      min-height: 480px;
    }

    .pane{
      position:relative;
      background:var(--panel);
      overflow:hidden;
    }

    /* 左ペイン幅（初期値） */
    #leftPane{ width: 450px; min-width: 280px; max-width: 70vw; }
    #rightPane{ flex:1; min-width: 320px; }

    /* iframe共通 */
    iframe{
      width:100%;
      height:100%;
      border:0;
      display:block;
      background:#fff;
    }

    /* 仕切り（ドラッグハンドル） */
    .divider{
      width: var(--divider);
      cursor: col-resize;
      background: transparent;
      position:relative;
      border-left:1px solid var(--line);
      border-right:1px solid var(--line);
    }
    .divider::before{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(180deg, rgba(96,165,250,.25), rgba(96,165,250,0));
      opacity:.25;
    }
    .divider:hover::before{ opacity:.45; }

    /* パネル上の操作ボタン */
    .toolbar{
      position:absolute;
      top:10px; right:10px;
      display:flex; gap:8px;
      z-index:5;
    }
    .btn{
      font-size:12px;
      padding:8px 10px;
      border:1px solid var(--line);
      background: rgba(15, 23, 42, .8);
      color: var(--text);
      border-radius:10px;
      text-decoration:none;
      backdrop-filter: blur(6px);
    }
    .btn:hover{ border-color: rgba(96,165,250,.6); }

    /* 読み込みオーバーレイ */
    .loading{
      position:absolute; inset:0;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:10px;
      background: rgba(2,6,23,.65);
      color: var(--text);
      z-index:4;
      transition: opacity .25s ease, visibility .25s ease;
    }
    .loading.hidden{ opacity:0; visibility:hidden; }
    .spinner{
      width:28px; height:28px;
      border:3px solid rgba(255,255,255,.25);
      border-top-color: var(--accent);
      border-radius:50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin{ to{ transform: rotate(360deg); } }

    /* スマホ：上下に */
    @media (max-width: 900px){
      .container{ flex-direction:column; }
      #leftPane{ width: 100%; height: 48vh; max-width:none; }
      #rightPane{ height: calc(52vh - var(--divider)); }
      .divider{ height: var(--divider); width:100%; cursor: row-resize; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">Toilet English</div>
    <div class="hint">左：神戸市ページ（翻訳）／右：マップ（ドラッグで幅調整可）</div>
  </header>

  <div class="container" id="container">
    <!-- LEFT -->
    <section class="pane" id="leftPane">
      <div class="toolbar">
        <a class="btn" href="https://kobe.j-server.com/LUCAIKOBE/ns/tl.cgi/https://kobe.j-server.com/LUCAIKOBE/ns/warning_mess4.cgi?url=https%3a//www.city.kobe.lg.jp/a30028/shise/kekaku/universal/toshidukuri/toilet/itiran.html#a&SLANG=ja&TLANG=en&XMODE=0&XJSID=0"
           target="_blank" rel="noopener">左を別タブで開く</a>
      </div>
      <div class="loading" id="loadingLeft">
        <div class="spinner"></div>
        <div>左側を読み込み中…</div>
      </div>
      <iframe
        id="frameLeft"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        src="https://kobe.j-server.com/LUCAIKOBE/ns/tl.cgi/https://kobe.j-server.com/LUCAIKOBE/ns/warning_mess4.cgi?url=https%3a//www.city.kobe.lg.jp/a30028/shise/kekaku/universal/toshidukuri/toilet/itiran.html#a&SLANG=ja&TLANG=en&XMODE=0&XJSID=0">
      </iframe>
    </section>

    <!-- DIVIDER -->
    <div class="divider" id="divider" title="ドラッグで幅を調整"></div>

    <!-- RIGHT -->
    <section class="pane" id="rightPane">
      <div class="toolbar">
        <a class="btn" href="https://www.google.com/maps/d/u/0/viewer?mid=1hO-HZRC9lcE_vElcpKCzoDbhT1_YaKE&femb=1&ll=34.743000308717896%2C135.12759400000002&z=11&hl=en"
           target="_blank" rel="noopener">右を別タブで開く</a>
      </div>
      <div class="loading" id="loadingRight">
        <div class="spinner"></div>
        <div>右側（マップ）を読み込み中…</div>
      </div>
      <iframe
        id="frameRight"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        src="https://www.google.com/maps/d/u/0/viewer?mid=1hO-HZRC9lcE_vElcpKCzoDbhT1_YaKE&femb=1&ll=34.743000308717896%2C135.12759400000002&z=11&hl=en">
      </iframe>
    </section>
  </div>

  <script>
    // ローディング表示を消す（loadイベント）
    const left = document.getElementById('frameLeft');
    const right = document.getElementById('frameRight');
    left.addEventListener('load', () => document.getElementById('loadingLeft').classList.add('hidden'));
    right.addEventListener('load', () => document.getElementById('loadingRight').classList.add('hidden'));

    // 仕切りドラッグで幅調整（PC：左右 / スマホ：上下）
    const divider = document.getElementById('divider');
    const leftPane = document.getElementById('leftPane');
    const container = document.getElementById('container');

    let dragging = false;

    const isVertical = () => window.matchMedia('(max-width: 900px)').matches;

    const onMove = (clientX, clientY) => {
      const rect = container.getBoundingClientRect();
      if (!isVertical()) {
        const x = Math.min(Math.max(clientX - rect.left, 280), rect.width * 0.7);
        leftPane.style.width = x + 'px';
      } else {
        const y = Math.min(Math.max(clientY - rect.top, 220), rect.height - 220);
        leftPane.style.height = y + 'px';
        leftPane.style.width = '100%';
      }
    };

    const startDrag = (e) => {
      dragging = true;
      document.body.style.userSelect = 'none';
      if (e.touches?.[0]) onMove(e.touches[0].clientX, e.touches[0].clientY);
    };
    const endDrag = () => {
      dragging = false;
      document.body.style.userSelect = '';
    };

    divider.addEventListener('mousedown', (e) => startDrag(e));
    window.addEventListener('mousemove', (e) => dragging && onMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', endDrag);

    divider.addEventListener('touchstart', (e) => startDrag(e), {passive:true});
    window.addEventListener('touchmove', (e) => dragging && onMove(e.touches[0].clientX, e.touches[0].clientY), {passive:true});
    window.addEventListener('touchend', endDrag);

    // 画面幅切替時の調整
    window.addEventListener('resize', () => {
      if (isVertical()) {
        leftPane.style.width = '100%';
      } else {
        leftPane.style.height = '';
      }
    });
  </script>
</body>
</html>
